spring:
  datasource:
    url: jdbc:h2:mem:teamnote;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:db/data.sql
      continue-on-error: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
